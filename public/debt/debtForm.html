<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>ثبت بدهی | آی شو شاپ</title>
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link rel="icon" type="image/svg+xml" href="/img/favicon.svg">
  <link rel="stylesheet" href="../css/fonts.css">
  <link rel="stylesheet" href="../css/shared.css">
  <link rel="stylesheet" href="/debt/debtForm.css">
</head>
<body>
  <div class="logout-btn-wrap">
    <button class="logout-btn-top" id="logoutBtn">
      <svg viewBox="0 0 48 48" fill="none" stroke="#fff" stroke-width="2.2"><path d="M17 12v-3a4 4 0 0 1 4-4h10a4 4 0 0 1 4 4v30a4 4 0 0 1-4 4H21a4 4 0 0 1-4-4v-3"/><path d="M9 24h22M9 24l7-7M9 24l7 7"/></svg>
      <span>خروج</span>
    </button>
  </div>

  <div class="container-main">
    <div class="header-title">ثبت بدهی</div>
    <div class="form-beauty-wrap">
      
      <div class="form-step">
        <label for="phone">شماره موبایل مشتری</label>
        <div class="input-group">
          <input type="tel" id="phone" name="phone" class="input-style" placeholder="برای جستجوی مشتری وارد کنید..." maxlength="11" pattern="09\d{9}">
          <button id="lookupBtn" class="lookup-btn">بررسی</button>
        </div>
        <div id="phoneError" class="error-text"></div>
      </div>
      
      <div id="customerDetails" class="customer-info-card hidden">
        <span id="customerName"></span>
        <span>مانده بدهی: <span id="customerDebt"></span> تومان</span>
      </div>

      <form id="debtForm" class="form-step" autocomplete="off">
          <label for="amount">مبلغ بدهی (تومان)</label>
          <input type="text" id="amount" name="amount" class="input-style" placeholder="ابتدا مشتری را انتخاب کنید" inputmode="numeric" required disabled>
        
          <label for="description">توضیحات <span class="optional-text">(اختیاری)</span></label>
          <input type="text" id="description" name="description" class="input-style" placeholder="اختیاری..." disabled>
        
          <button type="submit" id="submit-btn" class="submit-btn" disabled>ثبت بدهی</button>
      </form>

    </div>
    <div class="shop-sign">گالری کیف و کفش آی شو شاپ</div>
  </div>

  <footer class="footer-bar">
    <div class="brand-footer">
      <img src="/img/logo.svg" alt="System-Tick Logo">
      <div>طراحی و توسعه توسط System-Tick Automation</div>
    </div>
  </footer>

  <div id="unifiedModal" class="modal-overlay">
    <div class="modal-box">
      <div id="modalIcon" class="modal-icon"></div>
      <h3 id="modalTitle" class="modal-title"></h3>
      <p id="modalMessage" class="modal-message"></p>
      <div id="modalActions" class="modal-actions"></div>
    </div>
  </div>
  
  <script src="/debt/debtForm.js"></script>
</body>
</html>
